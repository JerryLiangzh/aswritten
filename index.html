<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self';
        media-src 'self' blob:;
        object-src 'none';
        frame-src 'none';
        base-uri 'none';
        form-action 'none'
      " />
    <meta name="description" content="As I've Written" />
    <title>As I've Written</title>
  </head>
  <body>
    <main class="app-shell" id="app-shell">
      <header class="app-header">
        <h1>As I've Written</h1>
        <div class="app-header__actions">
          <button id="markdown-import" class="file-button" type="button" disabled>导入 Markdown</button>
          <button id="markdown-export" class="file-button" type="button" disabled>导出 Markdown</button>
          <input
            id="markdown-import-input"
            type="file"
            accept=".md,.markdown,text/markdown"
            hidden
          />
          <button
            id="usage-document-toggle"
            class="usage-document-toggle"
            type="button"
            aria-controls="usage-document"
            aria-expanded="false"
          >使用文档</button>
          <button
            id="formula-panel-toggle"
            class="formula-panel-toggle"
            type="button"
            aria-controls="formula-panel"
            aria-expanded="false"
            disabled
          >公式助手</button>
        </div>
      </header>
      <p id="document-status" class="document-status" role="status" aria-live="polite"></p>
      <button id="document-reload" class="file-button" type="button" hidden>导出备份并刷新</button>
      <output id="selection-debug" data-testid="selection-debug" hidden></output>
      <div class="editor-layout">
        <div id="editor"></div>
        <aside id="formula-panel" aria-label="公式助手" hidden></aside>
      </div>
      <aside id="usage-document" class="usage-document" aria-label="使用文档" hidden></aside>
    </main>
    <script id="vditorIconScript" src="/vditor/dist/js/icons/ant.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
